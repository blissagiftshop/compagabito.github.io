<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Gentle Shepherd Co. — Jesus Keepsake Collection coming soon." />
  <title>The Gentle Shepherd Co. | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f0e4;
      --bg2:#efe2ce;
      --green:#163f33;
      --green2:#20493d;
      --gold:#c59a4a;
      --gold2:#b88935;
      --text:#3b463f;
      --soft:#7c7f78;
      --line:rgba(197,154,74,.75);
      --white:#fffdfa;
      --shadow:0 24px 60px rgba(22,63,51,.08);
    }

    *{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{
      min-height:100vh;
      font-family:"Inter",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 20%, rgba(255,255,255,.65), transparent 32%),
        radial-gradient(circle at 85% 80%, rgba(255,255,255,.55), transparent 28%),
        linear-gradient(160deg, var(--bg) 0%, #f6eedf 40%, var(--bg2) 100%);
      overflow-x:hidden;
    }

    .page{
      min-height:100vh;
      padding:28px;
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      isolation:isolate;
    }

    .page::before,
    .page::after{
      content:"";
      position:absolute;
      inset:auto;
      width:360px;
      height:360px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,255,255,.35), transparent 62%);
      z-index:-2;
      filter:blur(12px);
    }
    .page::before{top:30px;left:20px}
    .page::after{right:20px;bottom:30px}

    .shell{
      position:relative;
      width:min(1120px, 100%);
      background:rgba(255,253,249,.38);
      backdrop-filter: blur(6px);
      border:1.25px solid rgba(197,154,74,.45);
      box-shadow:var(--shadow);
      border-radius:22px;
      padding:52px 40px 44px;
      overflow:hidden;
    }

    .shell::before{
      content:"";
      position:absolute;
      inset:16px;
      border:1px solid rgba(197,154,74,.55);
      border-radius:14px;
      pointer-events:none;
    }

    .leaf{
      position:absolute;
      color:rgba(22,63,51,.18);
      font-family:"Cormorant Garamond",serif;
      font-size:140px;
      line-height:1;
      user-select:none;
      pointer-events:none;
    }
    .leaf.left{left:-14px;bottom:74px;transform:rotate(-8deg)}
    .leaf.right{right:-20px;top:86px;transform:scaleX(-1) rotate(-14deg)}
    .leaf.bottom{right:62px;bottom:-6px;font-size:110px;opacity:.14}

    .inner{
      max-width:760px;
      margin:0 auto;
      text-align:center;
      position:relative;
      z-index:1;
    }

    .logo{
      width:min(480px, 72vw);
      display:block;
      margin:0 auto 22px;
      filter:drop-shadow(0 10px 20px rgba(0,0,0,.04));
    }

    .micro{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      color:var(--gold2);
      font-size:12px;
      font-weight:600;
      letter-spacing:.34em;
      text-transform:uppercase;
      margin:6px 0 20px;
    }
    .micro::before,.micro::after{
      content:"";
      width:82px;
      max-width:12vw;
      height:1px;
      background:var(--line);
    }

    .ornament{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:16px;
      margin:16px auto 24px;
      color:var(--gold2);
      opacity:.95;
    }
    .ornament::before,.ornament::after{
      content:"";
      width:150px;
      max-width:22vw;
      height:1px;
      background:var(--line);
    }
    .ornament span{
      font-size:22px;
      line-height:1;
    }

    h1{
      margin:0;
      font-family:"Cormorant Garamond",serif;
      color:var(--green);
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.05em;
      font-size:clamp(46px, 7vw, 84px);
      line-height:.92;
    }

    .coming{
      margin:10px 0 10px;
      font-family:"Cormorant Garamond",serif;
      color:var(--green);
      font-style:italic;
      font-weight:500;
      font-size:clamp(36px, 4vw, 56px);
      line-height:1.1;
    }

    .tagline{
      margin:10px 0 8px;
      font-family:"Cormorant Garamond",serif;
      color:var(--green2);
      font-size:clamp(22px, 2.5vw, 34px);
      font-weight:600;
      line-height:1.25;
    }

    .sub{
      margin:0 auto 28px;
      max-width:640px;
      color:var(--soft);
      font-size:17px;
      line-height:1.7;
    }

    .notify-wrap{
      margin:26px auto 24px;
      max-width:720px;
      display:grid;
      grid-template-columns:1fr 210px;
      gap:14px;
    }

    .notify-wrap input{
      width:100%;
      height:64px;
      border-radius:14px;
      border:1px solid rgba(197,154,74,.55);
      background:rgba(255,252,245,.82);
      padding:0 22px;
      font-size:17px;
      color:var(--green);
      outline:none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.4);
    }

    .notify-wrap input::placeholder{
      color:#9e9a8f;
    }

    .notify-wrap button{
      height:64px;
      border:none;
      border-radius:14px;
      background:linear-gradient(180deg, var(--green2), var(--green));
      color:#f5e7c2;
      font-size:16px;
      font-weight:600;
      letter-spacing:.16em;
      text-transform:uppercase;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(22,63,51,.14);
      transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }
    .notify-wrap button:hover{
      transform:translateY(-1px);
      box-shadow:0 14px 28px rgba(22,63,51,.18);
    }

    .message{
      min-height:24px;
      margin-top:4px;
      color:var(--green2);
      font-size:14px;
    }

    .footer-orn{
      margin:28px auto 12px;
      color:var(--gold2);
      font-size:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
    }
    .footer-orn::before,.footer-orn::after{
      content:"";
      width:92px;
      max-width:14vw;
      height:1px;
      background:var(--line);
    }

    .footer{
      display:flex;
      justify-content:center;
      gap:18px;
      flex-wrap:wrap;
      margin-top:8px;
      color:#8d8b84;
      font-size:13px;
      letter-spacing:.04em;
    }

    @media (max-width: 760px){
      .page{padding:14px}
      .shell{padding:34px 20px 28px}
      .notify-wrap{
        grid-template-columns:1fr;
        gap:12px;
      }
      .notify-wrap button, .notify-wrap input{height:58px}
      .leaf{display:none}
      .micro{letter-spacing:.24em}
      .tagline{font-size:26px}
      .sub{font-size:15px}
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="shell">
      <div class="leaf left">❦</div>
      <div class="leaf right">❦</div>
      <div class="leaf bottom">❦</div>

      <div class="inner">
        <img src="tgsc-logo.png" alt="The Gentle Shepherd Co. logo" class="logo" />

        <div class="micro">Keep Jesus Close</div>
        <div class="ornament"><span>✧</span></div>

        <h1>Jesus Keepsake<br>Collection</h1>
        <div class="ornament"><span>✧</span></div>

        <div class="coming">Coming Soon</div>

        <p class="tagline">Faith-filled keepsakes for meaningful moments.</p>
        <p class="sub">Thoughtfully made plush keepsakes are on the way.</p>

        <form class="notify-wrap" id="notifyForm">
          <input type="email" id="email" placeholder="Enter your email for launch updates" required />
          <button type="submit">Notify Me</button>
        </form>
        <div id="message" class="message" aria-live="polite"></div>

        <div class="footer-orn">❦</div>
        <div class="footer">
          <span>The Gentle Shepherd Co.</span>
          <span>•</span>
          <span>thegentleshepherd.com</span>
        </div>
      </div>
    </section>
  </main>

  <script>
    const form = document.getElementById('notifyForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', function(e){
      e.preventDefault();
      message.textContent = "Thank you — we’ll let you know when we launch.";
      form.reset();
    });
  </script>
</body>
</html>
